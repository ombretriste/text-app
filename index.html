<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <title>TextCTRL</title>
  <meta name="description" content="Editor de texto sencillo: escribe y guarda en PDF, Word, HTML, Markdown o texto." />
  <meta name="theme-color" content="#090a18" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="TextCTRL" />
  <meta name="color-scheme" content="dark light" />
  <link rel="stylesheet" href="styles.css" />
  <script>
    // Aplica tema y fondo antes de pintar (evita un destello del tema equivocado)
    try {
      var d = JSON.parse(localStorage.getItem('text:display') || '{}');
      var light = d.theme === 'light' || (d.theme !== 'dark' && matchMedia('(prefers-color-scheme: light)').matches);
      document.documentElement.dataset.theme = light ? 'light' : 'dark';
      document.documentElement.dataset.wall = d.wall || 'tinta';
    } catch (e) {}
  </script>
</head>
<body class="booting">
  <!-- Pantalla de inicio -->
  <div id="splash" class="splash">
    <div class="sp-main">
      <span class="logo-slot" data-logo="132"></span>
      <div class="wordmark">
        <span class="wm-name">Text<b>CTRL</b></span>
        <span class="wm-by">by OmT Finance</span>
      </div>
    </div>
    <p class="sp-version" id="app-version"></p>
  </div>

  <!-- App -->
  <div id="app" class="app">
    <header class="topbar">
      <div class="brand-wrap" id="brand">
        <span class="logo-slot" data-logo="30"></span>
        <span class="brand">Text<b>CTRL</b></span>
      </div>
      <button id="back-btn" class="icon-btn" aria-label="Volver a los documentos" title="Documentos" hidden>
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>
      </button>
      <input id="doc-title" class="doc-title" maxlength="120" placeholder="Sin título" aria-label="Título del documento" autocomplete="off" hidden />
      <button id="save-btn" class="save-btn" type="button" hidden>Guardar como</button>
      <button id="menu-btn" class="icon-btn" aria-label="Más opciones" title="Más opciones" aria-haspopup="menu" aria-expanded="false">
        <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><g fill="currentColor"><circle cx="5" cy="12" r="1.8"/><circle cx="12" cy="12" r="1.8"/><circle cx="19" cy="12" r="1.8"/></g></svg>
      </button>
    </header>

    <main id="view"></main>
  </div>

  <div id="menu" class="menu" role="menu" hidden></div>
  <div id="pop" class="pop" hidden></div>
  <div id="toast" class="toast" role="status" hidden></div>
  <input id="file-open" type="file" accept=".docx,.txt,.md,.markdown,.html,.htm" hidden />
  <input id="file-image" type="file" accept="image/*" hidden />

  <!-- Vercel Web Analytics: sin cookies; solo visitas y las funciones que se abren, nunca el contenido. -->
  <script>
    window.va = window.va || function () { (window.vaq = window.vaq || []).push(arguments); };
    window.va('beforeSend', function (e) { return Object.assign({}, e, { url: e.url.split(/[?#]/)[0] }); });
  </script>
  <script defer src="/_vercel/insights/script.js"></script>
  <script src="formats.js"></script>
  <script src="app.js"></script>
</body>
</html>
